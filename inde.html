<script>
(()=>{
const w=document.getElementById('widget'), test=document.getElementById('test');
const p=new URLSearchParams(location.search);
const isTest=p.get('test')==='1';
const H=Math.max(0.05,Number(p.get('hide')||(isTest?0.08:10)));
const S=Math.max(0.05,Number(p.get('show')||(isTest?0.08:5)));
let timers=[]; const clear=()=>{timers.forEach(clearTimeout);timers=[]};
window.showNow=()=>{
  w.style.opacity='';
  w.classList.remove('hide','reveal','revealed');
  void w.offsetWidth;
  w.classList.add('show','reveal');
  timers.push(setTimeout(()=>{w.classList.remove('reveal');w.classList.add('revealed')},1900));
};
window.hideNow=()=>{
  w.classList.remove('reveal','revealed');
  w.classList.add('hide');
  timers.push(setTimeout(()=>{w.classList.remove('show','hide');w.style.opacity='0'},650));
};
function scheduleAfterHide(){
  timers.push(setTimeout(function appear(){
    showNow();
    timers.push(setTimeout(()=>{
      hideNow();
      scheduleAfterHide();
    },S*60000));
  },H*60000));
}
function cycle(){
  clear();
  if(isTest){
    showNow();
    timers.push(setTimeout(()=>{hideNow();scheduleAfterHide()},S*60000));
  }else{
    hideNow();
    scheduleAfterHide();
  }
}
window.restart=cycle; if(isTest)test.classList.add('show'); cycle();
})();
</script></body></html>
